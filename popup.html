<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { width: 320px; margin: 0; padding: 16px; background: #0f172a; color: #f8fafc; }
    .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .badge { background: linear-gradient(135deg, #6366f1, #10b981); width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; font-size: 14px; }
    h1 { font-size: 16px; margin: 0; }
    p.sub { font-size: 12px; color: #94a3b8; margin: 2px 0 0; }
    button.primary { width: 100%; padding: 11px; border: none; border-radius: 10px; background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; margin-bottom: 14px; }
    button.primary:hover { filter: brightness(1.1); }
    label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; margin: 10px 0 5px; }
    select, input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #f8fafc; font-size: 13px; }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    button.secondary { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; font-size: 12px; font-weight: 600; cursor: pointer; }
    button.secondary:hover { background: #334155; }
    .status { font-size: 11px; color: #10b981; min-height: 16px; margin-top: 8px; }
    .hint { font-size: 11px; color: #64748b; margin-top: 8px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="brand">
    <div class="badge">W</div>
    <div>
      <h1>WebMorph</h1>
      <p class="sub">Universal DOM Morphing Agent</p>
    </div>
  </div>

  <button class="primary" id="morphBtn">Activate WebMorph on This Page</button>

  <label for="lang">Simplified Language</label>
  <select id="lang">
    <option value="English">English</option>
    <option value="Hindi">Hindi (हिन्दी)</option>
    <option value="Kannada">Kannada (ಕನ್ನಡ)</option>
    <option value="Gujarati">Gujarati (ગુજરાતી)</option>
  </select>

  <label for="apiKey">AI Key (Groq / Grok / Gemini)</label>
  <input id="apiKey" type="password" placeholder="gsk_... or xai-... or AIzaSy..." />

  <div class="row">
    <button class="secondary" id="saveBtn">Save Settings</button>
  </div>
  <div class="status" id="status"></div>
  <div class="hint">Shortcut on any site: <b>Alt + M</b>. Ultra-fast AI goal mapping and dark pattern shield enabled.</div>

  <script src="popup.js"></script>
</body>
</html>
